networks:
  stage3-net: {}

services:
  stage3-network:
    build: .
    container_name: shadowtrace-stage3
    restart: unless-stopped
    ports:
      - "2201:22"      # SSH, non-default external port
      - "31337:31337"  # verbose banner service
      # NOTE: port 3306 (internal_service.py) is intentionally NOT published
      # here - that's what makes it "internal-only" per the spec.
    networks:
      - stage3-net
    mem_limit: "512m"
    cpus: "1.0"
    # NOTE: see stage6-linux/compose.yaml's comment - `internal: true` here
    # would also block the NAT rules for the `ports:` mapping above (SSH /
    # banner service would become unreachable). If strict no-egress is
    # needed for the report, enforce it via a Docker-host firewall rule
    # instead of the network flag.
